# widget.karasu.live - static site behind Cloudflare (SSL mode: Full (strict)).
# Installed at /www/server/panel/vhost/nginx/widget.karasu.live.conf.
# The certificate is Let's Encrypt via certbot's webroot challenge; Cloudflare
# lets /.well-known/acme-challenge/ through over plain HTTP, so port 80 serves it.

server {
    listen 80;
    server_name widget.karasu.live;
    root /www/wwwroot/widget.karasu.live;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name widget.karasu.live;
    root /www/wwwroot/widget.karasu.live;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/widget.karasu.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widget.karasu.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/widget.karasu.live.log;
    error_log /www/wwwlogs/widget.karasu.live.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Pages are revalidated on every load so a fix reaches every OBS at once.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Assets are versioned with ?v=, fonts and images never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
